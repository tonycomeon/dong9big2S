<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#d3d5e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말랑이">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>말랑이 컬러 소트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: one-screen bead board. Pills on top, the pixel picture fills the middle, three 3x3 trays hang under it, small buttons last. */
:root{
  --bg:#d3d5e6; --panel:#f4f4fa; --ink:#4a4a63; --soft:#8587a3; --pill:#9a9cb5; --pill-ink:#ffffff;
  --slot:#e3e4ee; --edge:#b9bbd0; --accent:#ff7f9f; --accent-ink:#ffffff; --shadow:#6c6f9033;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#25263a; --panel:#34364f; --ink:#f0f0fa; --soft:#a6a8c4; --pill:#4a4c6b; --pill-ink:#f0f0fa;
  --slot:#2a2b42; --edge:#55587a; --accent:#ff8fab; --accent-ink:#3a1826; --shadow:#00000055; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#25263a; --panel:#34364f; --ink:#f0f0fa; --soft:#a6a8c4; --pill:#4a4c6b; --pill-ink:#f0f0fa;
  --slot:#2a2b42; --edge:#55587a; --accent:#ff8fab; --accent-ink:#3a1826; --shadow:#00000055; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);padding-inline:16px;padding-block:12px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:10px;max-width:620px;margin-inline:auto;
  -webkit-tap-highlight-color:transparent;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:var(--pill);color:var(--pill-ink);border:0;border-radius:999px;padding:7px 16px;font-size:18px}
#pct{font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
#name{font-size:16px;color:var(--soft);flex:1;text-align:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{border-radius:10px;box-shadow:0 0 0 4px var(--panel),0 8px 0 var(--shadow);display:block;cursor:pointer;touch-action:none}
#trays{display:flex;justify-content:center;gap:10px}
.tray{position:relative;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:6px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;box-shadow:0 4px 0 var(--shadow)}
.slot{width:clamp(18px,6.2vw,28px);aspect-ratio:1;border-radius:50%;background:var(--slot)}
.tray.locked .slot{opacity:.4}
#unlock{position:absolute;inset:0;margin:auto;height:34px;width:80%;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:15px}
.bar{display:flex;gap:8px}
.bar button,.bar label{flex:1;text-align:center;font-size:15px;background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:9px 4px;cursor:pointer}
.bar button:disabled{opacity:.45;cursor:default}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:14px;font-size:15px;max-width:86vw;text-align:center;pointer-events:none}
.over{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border-radius:24px;padding:22px 20px;text-align:center;max-width:360px;width:100%;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.card h2{margin:0;font-size:26px;font-weight:400;color:var(--accent)}
.card p{margin:0;color:var(--soft);font-size:15px}
.card .go{border:0;background:var(--accent);color:var(--accent-ink);font-size:18px;border-radius:16px;padding:12px 26px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
#grid button{border:2px solid var(--edge);background:var(--bg);border-radius:10px;padding:8px 0;font-size:15px;font-variant-numeric:tabular-nums}
#grid button:disabled{opacity:.35}
#grid button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>

<header>
  <button class="pill" id="lvbtn" type="button">Lv 1</button>
  <div id="name"></div>
  <div id="pct">0%</div>
</header>
<div id="wrap"><canvas id="cv" aria-label="구슬 그림판"></canvas></div>
<div id="trays"></div>
<div class="bar">
  <button id="undo" type="button">되돌리기</button>
  <button id="reset" type="button">다시 하기</button>
  <label for="file">내 그림으로</label>
  <input id="file" type="file" accept="image/*" hidden>
</div>
<div id="toast" hidden></div>
<div class="over" id="win" hidden><div class="card">
  <h2 id="wint">완성!</h2><p id="winp"></p>
  <button class="go" id="next" type="button">다음 단계</button>
</div></div>
<div class="over" id="sel" hidden><div class="card">
  <h2>단계 고르기</h2><p>깬 단계 다음까지 열려요.</p>
  <div id="grid"></div>
  <button class="go" id="selx" type="button">닫기</button>
</div></div>

<script>
const $=id=>document.getElementById(id), MAXLV=100;
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mixc={};function mix(a,b,t){const k=a+b+t;if(mixc[k])return mixc[k];const A=hex(a),B=hex(b);return mixc[k]='#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
const dist=(a,b)=>{const A=hex(a),B=hex(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])};

/* ---------- pictures: original blob friends, generated per level ---------- */
const BODY=['#fff6e0','#ffc2d4','#ffe08a','#aee8c8','#a9dcff','#cdbcff','#ffc9a3','#d9a877','#ffffff'];
const BG=['#bfe3ff','#ffd9e3','#d9f2c4','#e4d9ff','#fff0b8','#c9f0ea','#8ea6e0','#ffdcc2'];
const GROUND=['#9fd98a','#ffffff','#f2c6a0','#f7a8c0',null];
const ACC=['#ff6f91','#5aa9e6','#ffb300','#7bc950','#b47aea'];
const OUT='#6b4a45', BLUSH='#ff8fa3';
const KIND=['곰','토끼','고양이','동글이'], ADJ=['말랑','폭신','졸린','씩씩한','수줍은','배고픈','신난','뽀짝'];
function makePicture(lv){
  const r=rng32(lv*9973+11), t=Math.floor((lv-1)/20), W=12+2*t, H=Math.round(W*1.2);
  const pal=[], ci=h=>{let i=pal.indexOf(h);if(i<0){pal.push(h);i=pal.length-1}return i};
  const pick=a=>a[Math.floor(r()*a.length)];
  const bg=pick(BG), g=new Array(W*H).fill(ci(bg));
  const dc=ci(bg==='#fff0b8'?'#ffffff':'#fff7a8');
  for(let k=0;k<Math.round(W/2.2);k++)g[Math.floor(r()*H*.45)*W+Math.floor(r()*W)]=dc;
  const gr=pick(GROUND);
  if(gr&&gr!==bg){const gh=Math.max(2,Math.round(H*.16)),gc=ci(gr);for(let y=H-gh;y<H;y++)for(let x=0;x<W;x++)g[y*W+x]=gc}
  const two=W>=16&&r()<.55, names=[];
  const one=(cx,rx)=>{
    let body;do{body=pick(BODY)}while(dist(body,bg)<70);
    const ear=Math.floor(r()*4), acc=Math.floor(r()*4), ac=pick(ACC), cy=H*.56, ry=H*.26;
    names.push(pick(ADJ)+' '+KIND[ear]);
    const m=new Int16Array(W*H).fill(-1), bc=ci(body), oc=ci(OUT);
    const set=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<W&&y<H)m[y*W+x]=c};
    const el=(ex,ey,erx,ery,c)=>{for(let y=Math.floor(ey-ery);y<=Math.ceil(ey+ery);y++)for(let x=Math.floor(ex-erx);x<=Math.ceil(ex+erx);x++)
      if(((x+.5-ex)/erx)**2+((y+.5-ey)/ery)**2<=1)set(x,y,c)};
    for(const s of[-1,1]){
      if(ear===0)el(cx+s*rx*.7,cy-ry*.85,rx*.3+.4,rx*.3+.4,bc);
      if(ear===1)el(cx+s*rx*.45,cy-ry*1.3,rx*.2+.4,ry*.55,bc);
      if(ear===2){const hh=Math.max(2,Math.round(ry*.5));for(let k=0;k<=hh;k++)for(let d=-k*.6;d<=k*.6;d++)set(cx+s*rx*.6+d,cy-ry*1.25+k,bc)}
      set(cx+s*rx*.45,cy+ry+.2,bc); set(cx+s*(rx+.3),cy+ry*.25,bc);
    }
    el(cx,cy,rx,ry,bc);
    if(acc===1)el(cx,cy+ry*.5,rx*.5,ry*.38,ci(body==='#ffffff'?'#fff6e0':'#ffffff'));
    if(acc===2)el(cx,cy-ry*.98,rx*.55,ry*.24,ci(ac));
    if(acc===3){const bx=cx+rx*.5,by=cy-ry*.92;set(bx-1,by,ci(ac));set(bx+1,by,ci(ac));set(bx,by,oc)}
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(m[i]>=0)continue;
      if((x>0&&m[i-1]>=0)||(x<W-1&&m[i+1]>=0)||(y>0&&m[i-W]>=0)||(y<H-1&&m[i+W]>=0))g[i]=oc}
    for(let i=0;i<m.length;i++)if(m[i]>=0)g[i]=m[i];
    const e=Math.max(1,Math.round(rx*.42)), ey=Math.floor(cy-ry*.2), eh=rx>=5.5?2:1, L=Math.floor(cx-e-.5), R=Math.floor(cx+e+.5);
    const put=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<H)g[y*W+x]=c};
    for(let k=0;k<eh;k++){put(L,ey+k,oc);put(R,ey+k,oc)}
    if(rx>=3.5){put(L-1,ey+eh,ci(BLUSH));put(R+1,ey+eh,ci(BLUSH))}
    const mc=r()<.5?oc:ci(BLUSH);put(Math.floor(cx-.5),ey+eh+(eh>1?0:1),mc);put(Math.floor(cx+.5),ey+eh+(eh>1?0:1),mc);
  };
  if(two){one(W*.28,W*.2);one(W*.72,W*.2)}else one(W/2,W*.33);
  return{W,H,pal,target:g,name:names.join('와 ')};
}

/* ---------- game ---------- */
let P, bead, trays, cap, hist, wrong0, taps=0, lv=1, maxLv=1, custom=false, fx={}, raf=0, s=20;
const load=()=>{try{return JSON.parse(localStorage.getItem('mallang2'))}catch(e){return null}};
const save=()=>{try{localStorage.setItem('mallang2',JSON.stringify({lv,maxLv}))}catch(e){}};
function scramble(P,frac,r){
  const N=P.W*P.H,n=Math.round(frac*N),inS=new Uint8Array(N),sub=[];let guard=0;
  while(sub.length<n&&guard++<5000){
    const x0=Math.floor(r()*P.W),y0=Math.floor(r()*P.H),len=2+Math.floor(r()*5),rows=1+Math.floor(r()*2);
    for(let dy=0;dy<rows;dy++)for(let dx=0;dx<len;dx++){const x=x0+dx,y=y0+dy;if(x<P.W&&y<P.H&&!inS[y*P.W+x]){inS[y*P.W+x]=1;sub.push(y*P.W+x)}}
  }
  const b=sub.map(i=>P.target[i]).sort((a,c)=>a-c), off=Math.max(1,Math.floor(b.length*(.25+r()*.5))), out=P.target.slice();
  sub.forEach((c,k)=>out[c]=b[(k+off)%b.length]);
  return out;
}
function begin(pic,frac,seed){
  P=pic;bead=scramble(P,frac,rng32(seed));trays=[];cap=18;hist=[];fx={};taps=0;
  wrong0=bead.filter((b,i)=>b!==P.target[i]).length||1;
  $('win').hidden=true;layout();ui();
}
function startLevel(n){lv=n;custom=false;save();begin(makePicture(n),.45+.45*(n-1)/(MAXLV-1),n*31+5)}
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
const empties=c=>{const o=[];for(let i=0;i<bead.length;i++)if(bead[i]<0&&P.target[i]===c)o.push(i);return o};
function shake(msg){const c=$('cv');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');if(msg)toast(msg)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function tap(i){
  const c=bead[i];
  if(c<0){
    const t=P.target[i],k=trays.indexOf(t);
    if(k<0)return shake('쟁반에 이 칸 색 구슬이 없어요.');
    hist.push({b:bead.slice(),t:trays.slice(),cap});if(hist.length>120)hist.shift();
    trays.splice(k,1);bead[i]=t;fx[i]=performance.now();taps++;buzz();ui();anim();
    if(bead.every((b,j)=>b===P.target[j]))setTimeout(win,400);
    return;
  }
  if(c===P.target[i])return;
  if(trays.length>=cap)return shake('쟁반이 꽉 찼어요. 빈 칸을 눌러 구슬부터 꽂아요.');
  hist.push({b:bead.slice(),t:trays.slice(),cap});if(hist.length>120)hist.shift();
  bead[i]=-1;trays.push(c);taps++;buzz();ui();
  if(trays.length>=cap&&!trays.some(t=>empties(t).length))
    toast(cap<27?'막혔어요! 쟁반을 하나 더 열거나 되돌려봐요.':'막혔어요! 되돌리기나 다시 하기를 눌러봐요.');
}
function win(){
  if(!custom&&lv>=maxLv&&lv<MAXLV){maxLv=lv+1;save()}
  $('wint').textContent=custom?'내 그림 완성!':`Lv ${lv} 완성!`;
  $('winp').textContent=(custom?'직접 고른 그림을 다 맞췄어요.':(lv>=MAXLV?'100단계를 전부 깼어요. 대단해요!':`${P.name} 그림을 완성했어요.`))+` (${taps}번 터치)`;
  $('next').textContent=custom?'단계로 돌아가기':(lv>=MAXLV?'처음부터 다시':'다음 단계');
  $('win').hidden=false;$('next').focus();
}
function ui(){
  $('lvbtn').textContent=custom?'내 그림':'Lv '+lv;$('name').textContent=custom?'':P.name;
  const wrong=bead.filter((b,i)=>b!==P.target[i]).length;
  $('pct').textContent=Math.max(0,Math.round(100*(1-wrong/wrong0)))+'%';
  $('undo').disabled=!hist.length;
  const T=$('trays');T.innerHTML='';
  for(let t=0;t<3;t++){const d=document.createElement('div');const locked=t===2&&cap<27;d.className='tray'+(locked?' locked':'');
    for(let k=0;k<9;k++){const sl=document.createElement('div');sl.className='slot';const c=trays[t*9+k];
      if(c!==undefined){const h=P.pal[c];sl.style.background=`radial-gradient(circle at 35% 30%,${mix(h,'#ffffff',.55)},${h} 55%,${mix(h,'#000000',.25)})`}
      d.appendChild(sl)}
    if(locked){const b=document.createElement('button');b.id='unlock';b.type='button';b.textContent='+ 열기';b.onclick=()=>{cap=27;ui()};d.appendChild(b)}
    T.appendChild(d)}
  draw();
}
function layout(){
  const w=$('wrap'),cv=$('cv'),dpr=window.devicePixelRatio||1;
  s=Math.max(8,Math.floor(Math.min((w.clientWidth-8)/P.W,(w.clientHeight-16)/P.H)));
  cv.style.width=P.W*s+'px';cv.style.height=P.H*s+'px';cv.width=P.W*s*dpr;cv.height=P.H*s*dpr;
  cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);draw();
}
function draw(){
  if(!P)return;const x=$('cv').getContext('2d'),now=performance.now();let live=false;
  for(let i=0;i<bead.length;i++){
    const cx=(i%P.W)*s,cy=Math.floor(i/P.W)*s,t=P.pal[P.target[i]],b=bead[i],mx=cx+s/2,my=cy+s/2;
    if(b===P.target[i]){x.fillStyle=t;x.fillRect(cx,cy,s,s);
      x.fillStyle='rgba(255,255,255,.16)';x.beginPath();x.arc(mx,my,s*.36,0,7);x.fill();
    }else{x.fillStyle=mix(t,'#ffffff',.6);x.fillRect(cx,cy,s,s);
      if(b<0){x.fillStyle=mix(t,'#000000',.18);x.beginPath();x.arc(mx,my,s*.2,0,7);x.fill()}
      else{const h=P.pal[b];
        x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.arc(mx,my+s*.06,s*.44,0,7);x.fill();
        x.fillStyle=h;x.beginPath();x.arc(mx,my,s*.43,0,7);x.fill();
        x.lineWidth=Math.max(1,s*.07);x.strokeStyle=mix(h,'#000000',.3);x.stroke();
        x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.arc(mx-s*.14,my-s*.15,s*.11,0,7);x.fill()}
    }
    if(fx[i]){const a=1-(now-fx[i])/350;if(a>0){live=true;x.fillStyle=`rgba(255,255,255,${a*.8})`;x.fillRect(cx,cy,s,s)}else delete fx[i]}
  }
  return live;
}
function anim(){cancelAnimationFrame(raf);const f=()=>{if(draw())raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}

$('cv').addEventListener('pointerdown',e=>{e.preventDefault();const r=$('cv').getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/s),y=Math.floor((e.clientY-r.top)/s);
  if(x>=0&&y>=0&&x<P.W&&y<P.H&&$('win').hidden)tap(y*P.W+x)});
$('undo').onclick=()=>{const h=hist.pop();if(h){bead=h.b;trays=h.t;cap=h.cap;taps++;ui()}};
$('reset').onclick=()=>{if(custom&&hist.length){const h=hist[0];bead=h.b;trays=h.t;cap=18;hist=[];ui()}else if(!custom)startLevel(lv)};
$('next').onclick=()=>startLevel(custom?lv:(lv>=MAXLV?1:lv+1));
$('lvbtn').onclick=()=>{const G=$('grid');G.innerHTML='';
  for(let n=1;n<=MAXLV;n++){const b=document.createElement('button');b.type='button';b.textContent=n;b.disabled=n>maxLv;if(n===lv&&!custom)b.className='cur';
    b.onclick=()=>{$('sel').hidden=true;startLevel(n)};G.appendChild(b)}
  $('sel').hidden=false};
$('selx').onclick=()=>$('sel').hidden=true;
new ResizeObserver(()=>P&&layout()).observe($('wrap'));

/* ---------- any picture from the device becomes a bead board ---------- */
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();
  img.onload=()=>{
    const W=18,H=Math.max(12,Math.min(26,Math.round(W*img.height/img.width))),c=document.createElement('canvas');c.width=W;c.height=H;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
    const d=x.getImageData(0,0,W,H).data,px=[];for(let i=0;i<d.length;i+=4)px.push([d[i],d[i+1],d[i+2]]);
    const K=8,sorted=px.slice().sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));
    let cen=[];for(let k=0;k<K;k++)cen.push(sorted[Math.floor((k+.5)*sorted.length/K)].slice());
    let asg=new Array(px.length).fill(0);
    for(let it=0;it<8;it++){
      px.forEach((p,i)=>{let best=0,bd=1e9;cen.forEach((q,k)=>{const dd=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2;if(dd<bd){bd=dd;best=k}});asg[i]=best});
      const sum=cen.map(()=>[0,0,0,0]);px.forEach((p,i)=>{const q=sum[asg[i]];q[0]+=p[0];q[1]+=p[1];q[2]+=p[2];q[3]++});
      cen=cen.map((q,k)=>sum[k][3]?[sum[k][0]/sum[k][3],sum[k][1]/sum[k][3],sum[k][2]/sum[k][3]]:q);
    }
    const pal=[],map=[];cen.forEach((q,k)=>{const h='#'+q.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');let j=pal.indexOf(h);if(j<0){pal.push(h);j=pal.length-1}map[k]=j});
    custom=true;begin({W,H,pal,target:asg.map(k=>map[k]),name:''},.45,Date.now()&0xffff);
    hist=[];URL.revokeObjectURL(img.src);
  };
  img.onerror=()=>toast('이 파일은 그림으로 열 수 없어요.');
  img.src=URL.createObjectURL(f);e.target.value='';
};

const sv=load();if(sv){maxLv=Math.min(MAXLV,sv.maxLv||1);lv=Math.min(maxLv,sv.lv||1)}
startLevel(lv);
</script>
